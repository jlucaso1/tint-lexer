name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and wasm target check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features tint-cli/wgpu --locked -- -D warnings

      - name: Verify WebAssembly target compilation
        run: cargo check -p tint-web -p tint-tokenizer --target wasm32-unknown-unknown --locked

      - name: Verify WebAssembly compat ABI compilation
        run: cargo check -p tint-tokenizer --target wasm32-unknown-unknown --features tint-tokenizer/compat --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run JavaScript test suite
        run: npm test

      - name: Run smoke tests
        run: npm run smoke

      - name: Verify bundle size
        if: runner.os == 'Linux'
        run: npm run size

      - name: Ensure clean working tree
        run: git diff --exit-code
