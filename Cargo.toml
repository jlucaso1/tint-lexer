[workspace]
members = ["crates/tint-core", "crates/tint-model", "crates/tint-cli", "crates/tint-web", "crates/tint-tokenizer"]
default-members = ["crates/tint-core", "crates/tint-model", "crates/tint-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tint-core = { path = "crates/tint-core" }
tint-model = { path = "crates/tint-model" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1

[profile.web]
inherits = "release"
opt-level = 3
lto = true
strip = true
panic = "abort"
